<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Guarda-Roupa Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAINEL DE PERSONALIZAÇÃO DE CORES -->
    <header class="color-panel">
        <label for="bg-color">Cor de Fundo:</label>
        <input type="color" id="bg-color" value="#f4f1ea">
        
        <label for="btn-color">Cor dos Botões:</label>
        <input type="color" id="btn-color" value="#8b5cf6">
    </header>

    <main class="container">
        <h1> Provador Virtual</h1>

        <!-- TELA DO ROUPEIRO -->
        <div id="wardrobe" class="wardrobe">
            <div class="doors">
                <div class="door door-left"></div>
                <div class="door door-right"></div>
                <button id="open-btn" class="main-btn">Abrir Guarda-Roupa</button>
            </div>

            <!-- CONTEÚDO INTERNO DO ROUPEIRO -->
            <div class="wardrobe-content hidden" id="wardrobe-content">
                
                <!-- PAINEL DA FOTO DA PESSOA -->
                <section class="stage">
                    <h2>Seu Corpo</h2>
                    <input type="file" id="person-upload" accept="image/*" capture="user">
                    
                    <div class="stage-canvas" id="stage-canvas">
                        <span class="placeholder-text">Envie sua foto de corpo inteiro</span>
                        <img id="person-img" class="person-img hidden" alt="Foto da pessoa">
                        <!-- Peças de roupas sobrepostas vão entrar aqui -->
                    </div>
                </section>

                <!-- PAINEL DO GUARDA-ROUPA / PECAS -->
                <section class="closet">
                    <h2>Suas Peças</h2>
                    <div class="upload-box">
                        <label for="clothing-upload" class="custom-file-upload">
                            + Adicionar Peça
                        </label>
                        <input type="file" id="clothing-upload" accept="image/*">
                    </div>

                    <div class="clothing-list" id="clothing-list">
                        <!-- As fotos das roupas adicionadas vão aparecer aqui -->
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
